version: 2

models:
  - name: stg_raw__olist_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: stg_raw__olist_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null

  - name: stg_raw__olist_order_payments
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_raw__olist_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_raw__olist_sellers
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: stg_raw__olist_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique